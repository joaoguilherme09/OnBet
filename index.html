<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="64x64" href="/assets/favicon-64.png" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#141518" />
    <meta name="description" content="ON BETS — a central de palpites da ORG ON Camps. Pontos virtuais, sem dinheiro real." />
    <script>
      // aplica o tema salvo antes de desenhar a página (evita piscar no tema escuro)
      try {
        var colors = { light: '#faf7f0', efootball: '#05071a' }
        var t = localStorage.getItem('onbets-theme')
        if (colors[t]) {
          document.documentElement.dataset.theme = t
          document.querySelector('meta[name="theme-color"]').content = colors[t]
        }
      } catch {}
    </script>
    <title>ON BETS | Palpites da ORG ON Camps</title>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
